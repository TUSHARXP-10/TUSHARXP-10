name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # rembg/opencv are only for prep_photo.py, which you run locally
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 pillow numpy
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/*.json assets/*.svg assets/cards/*.svg"
