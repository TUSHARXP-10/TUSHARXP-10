<svg xmlns="http://www.w3.org/2000/svg" width="480" height="134" viewBox="0 0 480 134"><defs></defs><g font-family="'JetBrains Mono','SF Mono',Menlo,'Roboto Mono','DejaVu Sans Mono',Consolas,'Liberation Mono','Courier New',monospace"><rect x=".5" y=".5" width="479" height="133" rx="11.2" fill="#0d1117" stroke="#30363d"/><line x1="1" y1="34" x2="479" y2="34" stroke="#30363d" stroke-opacity=".6"/><circle cx="19.6" cy="17" r="4.48" fill="#e0a458"/><circle cx="35" cy="17" r="4.48" fill="#d9b25c"/><circle cx="50.4" cy="17" r="4.48" fill="#c9a24f"/><text x="240" y="21.2" font-size="11.9" fill="#8b949e" text-anchor="middle">snapshot ~ git log</text><text x="20" y="70" font-size="13" fill="#8b949e">$ git log --all --graph --since=90.days</text><circle cx="25" cy="100" r="3.5" fill="#a9c98c"/><circle cx="25" cy="100" r="3.5" fill="none" stroke="#a9c98c" stroke-width="1.5"><animate attributeName="r" values="3.5;10.5" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/></circle><text x="38" y="104" font-size="14" fill="#8b949e">syncing recent activity from GitHub…</text></g></svg>
